<!-- templates/customers/_form.html -->
<!-- Member ID (編集時のみ表示) -->
{% if customer and customer.customer_id %}
<div>
    <label class="block text-sm font-semibold text-on-surface mb-2 tracking-wide">Member ID</label>
    <div class="relative">
        <input
            class="w-full bg-surface-container text-on-surface-variant border-outline-variant rounded-lg px-4 py-3 cursor-not-allowed font-mono text-sm"
            readonly type="text" value="FL-{{ customer.customer_id }}" />
        <span
            class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-lg">lock</span>
    </div>
</div>
{% endif %}

<!-- Full Name -->
<div class="space-y-1">
    <label class="block text-sm font-semibold text-on-surface mb-2 tracking-wide">お名前</label>
    <input
        class="w-full bg-white border-outline-variant rounded-lg px-4 py-3 focus:border-primary focus:ring-1 focus:ring-primary outline-none"
        name="full_name" placeholder="山田 太郎" type="text" value="{{ customer.full_name if customer else '' }}"
        required />
</div>

<!-- Phone Number -->
<div class="space-y-1">
    <label class="block text-sm font-semibold text-on-surface mb-2 tracking-wide">電話番号</label>
    <input
        class="w-full bg-white border-outline-variant rounded-lg px-4 py-3 focus:border-primary focus:ring-1 focus:ring-primary outline-none"
        name="phone_number" placeholder="090-0000-0000" type="tel"
        value="{{ customer.phone_number if customer else '' }}" />
</div>

<!-- Email Address -->
<div class="space-y-1">
    <label class="block text-sm font-semibold text-on-surface mb-2 tracking-wide">メールアドレス</label>
    <input
        class="w-full bg-white border-outline-variant rounded-lg px-4 py-3 focus:border-primary focus:ring-1 focus:ring-primary outline-none"
        name="email" placeholder="example@flare-salon.jp" type="email"
        value="{{ customer.email if customer else '' }}" />
</div>
