<!-- templates/customers/new.html -->
{% extends "layout/app_shell.html" %}

{% block content %}
<div class="mx-auto max-w-2xl">
    <div class="mb-8">
        <h2 class="font-headline-lg text-primary text-2xl">新規会員登録</h2>
        <p class="text-stone-500">お客様の情報を入力して新しいアカウントを作成します。</p>
    </div>

    <form method="POST" class="bg-white p-8 rounded-xl border border-stone-200 shadow-sm space-y-6">
        <!-- 部品を呼び出す -->
        {% include "customers/_form.html" %}

        <div class="flex items-center justify-end gap-4 pt-6 border-t">
            <button type="button" onclick="history.back()" class="px-6 py-2 text-stone-500">戻る</button>
            <button type="submit"
                class="bg-[#7A8E7C] text-white px-10 py-3 rounded-lg shadow-md hover:opacity-90 transition-opacity">登録する</button>
        </div>
    </form>
</div>
{% endblock %}
